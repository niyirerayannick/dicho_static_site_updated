<section class="container newsletter-section">
  <div class="footer-newsletter newsletter-card">
    <div class="newsletter-compact-content">
      <div class="newsletter-copy"><div><h3>Stay updated with ALVI</h3><p>Get product news, offers, and natural care tips.</p></div></div>
      <div class="newsletter-subscribe-wrap"><form action="{% url 'newsletter_subscribe' %}" method="post" class="newsletter-form">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}"><label class="visually-hidden" for="newsletter-email">Email address</label><div class="newsletter-input-wrap"><i class="bi bi-envelope"></i><input id="newsletter-email" class="form-control" name="email" type="email" required autocomplete="email" placeholder="Enter your email"></div><button class="btn newsletter-submit-btn" type="submit">Subscribe</button></form><p class="newsletter-note">No spam. Unsubscribe anytime.</p></div>
    </div>
  </div>
</section>
