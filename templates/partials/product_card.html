{% load static %}
<div class="col"><div class="product-card">{% if product.is_new %}<span class="badge-dicho">new</span>{% elif product.is_best_seller %}<span class="badge-dicho">best</span>{% endif %}<a class="product-card-img" href="{{ product.get_absolute_url }}">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}">{% else %}<img src="{% static product.asset_path %}" alt="{{ product.name }}">{% endif %}</a><div class="pt-3 product-card-body"><small class="text-muted product-card-category">{{ product.category.name }}</small><h5 class="mt-1 mb-1 product-card-title"><a class="text-dark" href="{{ product.get_absolute_url }}">{{ product.name }}</a></h5><div class="small text-muted mb-2 product-card-size">{{ product.size }}</div><div class="rating mb-2"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-half"></i> <span class="text-muted">(18)</span></div><div class="d-flex justify-content-between align-items-center product-card-footer"><span class="price product-card-price">RWF {{ product.price|floatformat:0 }}</span><form action="{% url 'cart_add' product.id %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}"><button class="btn btn-green btn-sm product-add-btn" {% if not product.in_stock %}disabled{% endif %}><i class="bi bi-cart3 me-1"></i>{% if product.in_stock %}Add{% else %}Sold out{% endif %}</button></form></div></div></div></div>
