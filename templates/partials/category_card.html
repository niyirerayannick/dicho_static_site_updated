{% load static %}<div class="col"><a class="text-dark" href="{{ category.get_absolute_url }}"><div class="category-card h-100">{% if category.image %}<img src="{{ category.image.url }}" alt="{{ category.name }}">{% else %}<img src="{% static category.asset_path %}" alt="{{ category.name }}">{% endif %}<div class="p-4 text-center"><div class="icon-circle"><i class="{{ category.icon_class|default:'bi bi-leaf' }}"></i></div><h5>{{ category.name }}</h5><p class="text-muted">{{ category.description }}</p><strong class="text-green">{{ category.product_count }} Product{{ category.product_count|pluralize }}</strong></div></div></a></div>
